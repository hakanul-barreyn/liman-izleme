# Liman İzleme – GitHub Actions ile ücretsiz çalıştırma
# Her saat: ~52 dakika AIS verisi toplar, analiz eder, biten günleri arşivleyip mühürler,
# ham veriyi Releases'a yükler, siteyi GitHub Pages'e yayımlar ve durumu 'durum' dalına kaydeder.
name: Liman izleme

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      dakika:
        description: "Kaç dakika veri toplansın"
        default: "52"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: liman-izleme
  cancel-in-progress: false

jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Kütüphaneleri kur
        run: pip install -q -r requirements.txt

      - name: Önceki durumu geri yükle
        run: |
          mkdir -p _durum
          if git ls-remote --exit-code --heads origin durum >/dev/null 2>&1; then
            git fetch -q --depth=1 origin durum
            git archive FETCH_HEAD | tar -x -C _durum
          fi
          python -m liman durum-yukle _durum

      - name: Veri topla, analiz et, arşivle
        id: tur
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          LIMAN_HAM_URL: https://github.com/${{ github.repository }}/releases/download/arsiv-{gun}/ham.jsonl.gz
        run: |
          set +e
          python -m liman tur --dakika "${{ inputs.dakika || '52' }}"
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      - name: Ham veriyi GitHub Releases'a yükle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m liman ham-hazirla
          has_asset() { gh release view "arsiv-$1" --json assets -q '.assets[].name' 2>/dev/null | grep -qx ham.jsonl.gz; }
          for f in site/arsiv/*/ham.jsonl.gz; do
            [ -e "$f" ] || continue
            d=$(basename "$(dirname "$f")")
            if ! has_asset "$d"; then
              h=$(sha256sum "site/arsiv/$d/MANIFEST.sha256" | cut -d' ' -f1)
              gh release create "arsiv-$d" "$f" --title "Arşiv $d" --latest=false \
                --notes "Ham AIS verisi. Gün hash'i (MANIFEST.sha256 dosyasının SHA-256'sı): $h" \
                || gh release upload "arsiv-$d" "$f" --clobber || true
            fi
            if has_asset "$d"; then
              rm -f "$f" "data/ham/$d.jsonl"
            else
              echo "::warning::$d ham verisi yüklenemedi; bir sonraki çalıştırmada yeniden denenecek"
              rm -f "$f"
            fi
          done

      - name: Arşivi ve kanıt zincirini depoya kaydet
        run: |
          git config user.name "liman-izleme-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/arsiv site/kanit
          if ! git diff --cached --quiet; then
            git commit -q -m "Arşiv: $(ls site/arsiv | tail -1)"
            for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 10; done
          fi

      - name: Durumu kaydet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m liman durum-kaydet _durum_cikis
          cd _durum_cikis
          git init -q -b durum
          git add .
          git -c user.name=liman-izleme-bot -c user.email=bot@users.noreply.github.com commit -q -m "durum $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" durum

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Toplama hatası varsa işi başarısız göster
        if: steps.tur.outputs.rc != '0'
        run: |
          echo "::error::Veri toplama sırasında hata oluştu; ayrıntılar 'Veri topla' adımında"
          exit 1

  yayinla:
    needs: topla
    if: always() && needs.topla.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
