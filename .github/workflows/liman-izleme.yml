# Avvam – GitHub Actions ile ücretsiz çalıştırma
# Her saat: ~48 dakika AIS verisi toplar, analiz eder, biten günleri arşivleyip mühürler,
# ham veriyi Releases'a yükler, siteyi GitHub Pages'e yayımlar ve durumu Actions önbelleğine kaydeder.
# GFW_API_TOKEN gizli anahtarı varsa geçmişe dönük taramayı da her çalıştırmada biraz ilerletir.
name: Avvam

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      dakika:
        description: "Kaç dakika veri toplansın"
        default: "48"
      gecmis_baslangic:
        description: "Geçmiş taramayı başlat: başlangıç tarihi (ör. 2024-05-02). Boş bırak = devam et"
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: liman-izleme
  cancel-in-progress: false

jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      GFW_API_TOKEN: ${{ secrets.GFW_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Kütüphaneleri kur
        run: pip install -q -r requirements.txt

      - name: Önceki durumu önbellekten al
        uses: actions/cache/restore@v4
        with:
          path: _durum
          key: durum-${{ github.run_id }}
          restore-keys: durum-

      - name: Önceki durumu geri yükle
        id: yukle
        run: python -m liman durum-yukle _durum

      # GFW geçmiş taraması ve gemi kimlikleri, AIS toplanırken arka planda çalışır (ağ bekleyen iki iş);
      # site, ikisi de bitince üretilir. İstek sayısı GFW'nin günlük sınırının altında tutulur (liman/gfw_sinir.py).
      - name: Veri topla, geçmişi tara, analiz et, arşivle
        id: tur
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          LIMAN_HAM_URL: https://github.com/${{ github.repository }}/releases/download/arsiv-{gun}/ham.jsonl.gz
        run: |
          set +e
          BG=""
          if [ -n "$GFW_API_TOKEN" ]; then
            # ayrı süreç grubu: çok uzarsa toplayıcı onu bütünüyle durdurabilir
            setsid bash -c 'python -m liman gecmis --baslangic "$1" --dilim 32 --istek 1800;
                            python -m liman gemi-bilgi --dilim 5 --istek 200' _ "${{ inputs.gecmis_baslangic }}" \
              > _gfw.log 2>&1 &
            BG=$!
          fi
          python -m liman tur --dakika "${{ inputs.dakika || '48' }}" ${BG:+--bekle-pid $BG}
          rc=$?
          if [ -n "$BG" ]; then
            wait "$BG"
            echo "::group::GFW geçmiş taraması ve gemi kimlikleri"; cat _gfw.log; echo "::endgroup::"
            grep -h "'gorev'\|Gemi bilgisi\|istek hakkı" _gfw.log | tail -3
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Ham veriyi GitHub Releases'a yükle
        if: always() && steps.yukle.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m liman ham-hazirla
          has_asset() { gh release view "arsiv-$1" --json assets -q '.assets[].name' 2>/dev/null | grep -qx ham.jsonl.gz; }
          for f in site/arsiv/*/ham.jsonl.gz; do
            [ -e "$f" ] || continue
            d=$(basename "$(dirname "$f")")
            if ! has_asset "$d"; then
              h=$(sha256sum "site/arsiv/$d/MANIFEST.sha256" | cut -d' ' -f1)
              gh release create "arsiv-$d" "$f" --title "Arşiv $d" --latest=false \
                --notes "Ham AIS verisi. Gün hash'i (MANIFEST.sha256 dosyasının SHA-256'sı): $h" \
                || gh release upload "arsiv-$d" "$f" --clobber || true
            fi
            if has_asset "$d"; then
              rm -f "$f" "data/ham/$d.jsonl"
            else
              echo "::warning::$d ham verisi yüklenemedi; bir sonraki çalıştırmada yeniden denenecek"
              rm -f "$f"
            fi
          done

      - name: Arşivi ve kanıt zincirini depoya kaydet
        if: always() && steps.yukle.outcome == 'success'
        run: |
          git config user.name "avvam-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for d in site/arsiv site/kanit; do
            if [ -d "$d" ]; then git add "$d"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -q -m "Arşiv: $(ls site/arsiv | tail -1)"
            for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 10; done
          fi

      - name: Durumu kaydet
        if: always() && steps.yukle.outcome == 'success'
        run: |
          # iş iptal edildiyse arka plandaki GFW taraması hâlâ yazıyor olabilir: önce durdur
          pkill -TERM -f "python -m liman (gecmis|gemi-bilgi)" && sleep 5 || true
          python -m liman durum-kaydet _durum

      - name: Durumu önbelleğe yaz
        if: always() && steps.yukle.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: _durum
          key: durum-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Harita kütüphanesi ve yazı tipini ekle
        if: always() && steps.yukle.outcome == 'success'
        run: bash kurulum/vendor.sh site/vendor || echo "::warning::Harita kütüphanesi indirilemedi; tarayıcı CDN'den yükleyecek"

      - uses: actions/upload-pages-artifact@v3
        if: always() && steps.yukle.outcome == 'success'
        with:
          path: site

      - name: Toplama hatası varsa işi başarısız göster
        if: steps.tur.outputs.rc != '0'
        run: |
          echo "::error::Veri toplama sırasında hata oluştu; ayrıntılar 'Veri topla' adımında"
          exit 1

  yayinla:
    needs: topla
    if: always() && needs.topla.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
