# Hemen yayınla: veri toplamadan, son kaydedilmiş durumdan siteyi üretip GitHub Pages'e yayımlar.
# Saatlik iş akışını beklemeden tasarım ve metin değişikliklerini yayına almak için elle çalıştırılır.
# Durumu kaydetmez; saatlik iş akışıyla çakışmaz.
name: Hemen yayınla

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hemen-yayinla
  cancel-in-progress: true

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Son durumu önbellekten al
        uses: actions/cache/restore@v4
        with:
          path: _durum
          key: durum-yayin-${{ github.run_id }}
          restore-keys: durum-
      - name: Durumu yükle
        run: python -m liman durum-yukle _durum
      - name: Gemi kimliği, firma ve fotoğraflar
        env:
          GFW_API_TOKEN: ${{ secrets.GFW_API_TOKEN }}
        run: python -m liman gemi-bilgi --dilim 4 --istek 300 || true
      - name: Siteyi üret
        run: |
          python -m liman gecmis || true
          python -m liman saatlik
          bash kurulum/vendor.sh site/vendor || echo "::warning::Harita kütüphanesi indirilemedi"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  yayinla:
    needs: uret
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
