# ============================================================================
#  Avvam – ayar dosyası (Türkiye → İsrail)
#  GitHub'da kalem simgesiyle düzenlenebilir; bir sonraki saatlik çalıştırma yeni ayarı kullanır.
#  Koordinatlar [enlem, boylam] sırasıyla, ondalık derece. Alanlar bilerek geniş çizildi
#  (demirleme sahaları dahil); ilk haftanın verisine bakılarak daraltılabilir.
# ============================================================================

proje:
  ad: "Avvam: Türkiye → İsrail"
  aciklama: >-
    Türk limanlarından çıkıp İsrail limanlarına doğrudan veya dolaylı yoldan giden gemilerin
    açık ve doğrulanabilir kaydı. Kayıtlar gemilerin kendi yayınladığı AIS verisine dayanır.
  saat_dilimi: "Europe/Istanbul"

# --- Test edilen resmî açıklamalar ---------------------------------------------
beyan:
  yonler: ["TR>IL", "IL>TR"]   # Türkiye'den İsrail'e ve İsrail'den Türkiye'ye
  aciklamalar:
    - metin: "İsrail'le ilgili ihracat ve ithalat işlemleri tüm ürünleri kapsayacak şekilde durdurulmuştur."
      kim: "T.C. Ticaret Bakanlığı"
      tarih: "2 Mayıs 2024"
      gun: "2024-05-02"
      etiket: "Ticaret durduruldu"
      etiket_en: "Trade halted"
      metin_en: "Export and import transactions related to Israel have been stopped, covering all products."
      kaynak: "Bloomberg HT"
      url: "https://www.bloomberght.com/israille-ticaret-tamamen-durduruldu-2352057"
    - metin: "İsrail ile ticaretimizi tamamen kestik. Türk gemilerinin İsrail limanlarına gitmesine izin vermiyoruz."
      kim: "Dışişleri Bakanı Hakan Fidan, TBMM olağanüstü oturumu (İngilizce aktarımdan çeviri)"
      tarih: "29 Ağustos 2025"
      gun: "2025-08-29"
      etiket: "Liman kısıtlamaları"
      etiket_en: "Port restrictions"
      metin_en: "We have completely cut our trade with Israel. We do not allow Turkish ships to go to Israeli ports."
      kaynak: "Al Jazeera"
      url: "https://www.aljazeera.com/news/2025/8/29/turkiye-closes-airspace-to-israel-entirely-cutting-ties-over-gaza-war"
  isaretler:
    - {gun: "2023-10-07", etiket: "7 Ekim", etiket_en: "7 October"}
    - {gun: "2024-04-09", etiket: "54 ürün grubunda kısıtlama", etiket_en: "Export curbs (54 groups)"}
  # Verinin sınadığı resmî açıklamalar (ana sayfa ve rapor). "aktarim: true" olanlar doğrudan alıntı değil,
  # kaynağın aktardığı açıklamanın özetidir; tırnaksız gösterilir.
  testler:
    - kimlik: ticaret
      metin: "İsrail'le ilgili ihracat ve ithalat işlemleri tüm ürünleri kapsayacak şekilde durdurulmuştur."
      metin_en: "Export and import transactions related to Israel have been stopped, covering all products."
      kim: "T.C. Ticaret Bakanlığı"
      kim_en: "Ministry of Trade of Türkiye"
      gun: "2024-05-02"
      kaynak: "Al Jazeera"
      url: "https://www.aljazeera.com/news/2024/5/2/turkey-says-it-halts-trade-with-israel-over-gaza-aid-access"
    - kimlik: ceyhan
      metin: "BTC boru hattıyla Ceyhan'daki terminale petrol gönderen şirketler Türkiye'nin İsrail'le ticareti durdurma kararına uydu; İsrail varışlı sevkiyat olmadı."
      metin_en: "Companies shipping oil through the BTC pipeline to the Ceyhan terminal have complied with Türkiye's decision to halt trade with Israel; no shipments with an Israeli destination have taken place."
      kim: "T.C. Enerji ve Tabii Kaynaklar Bakanlığı, yazılı açıklama"
      kim_en: "Ministry of Energy and Natural Resources of Türkiye, written statement"
      gun: "2024-11-11"
      kaynak: "Daily Sabah"
      url: "https://dailysabah.com/business/energy/turkiye-rejects-claims-of-oil-flowing-to-israel-from-ceyhan"
      aktarim: true
    - kimlik: bayrak
      metin: "Türk bayraklı gemilerin İsrail limanlarına gitmesine izin vermiyoruz."
      metin_en: "Turkish-flagged ships are not allowed to call at Israeli ports."
      kim: "Dışişleri Bakanı Hakan Fidan, TBMM"
      kim_en: "Foreign Minister Hakan Fidan, Grand National Assembly"
      gun: "2025-08-29"
      kaynak: "gCaptain (Reuters)"
      url: "https://gcaptain.com/turkey-halts-trade-with-israel-shuts-ports-to-all-shipping-links"
      aktarim: true
    - kimlik: hepsi
      metin: "2 Mayıs 2024'ten bu yana İsrail'le ihracat, ithalat, serbest bölge ve transit ticaretin tamamı durdu; İsrail'den gelen sevkiyat da yok. Filistin'e giden ürünler, Filistin'in limanı olmadığı için İsrail limanları üzerinden gidiyor (ayda 50-60 milyon dolar)."
      metin_en: "Since 2 May 2024 all exports, imports, free-zone and transit trade with Israel have stopped, and no shipments arrive from Israel. Goods for Palestine, which has no port of its own, pass through Israeli ports (USD 50-60 million a month)."
      kim: "T.C. Ticaret Bakanlığı, basın açıklaması"
      kim_en: "Ministry of Trade of Türkiye, press statement"
      gun: "2026-03-30"
      kaynak: "ticaret.gov.tr"
      url: "https://ticaret.gov.tr/haberler/israil-ile-ticaretin-surdugune-dair-asilsiz-iddialar-hakkinda-aciklama"
      aktarim: true
  karsi_gorus: >-
    Türkiye, BTC boru hattıyla Ceyhan'a gelen Azerbaycan petrolünün satışını kendisinin yapmadığını ve
    alıcısını belirlemediğini söylüyor; Enerji Bakanlığı BOTAŞ'ın bu satışlarda yer almadığını belirtti.
    Ağustos 2025'te limanlarda uygulandığı bildirilen kısıtlamalar (İsrail bağlantılı gemiler, İsrail'e
    askerî veya tehlikeli yük ve Türkiye üzerinden aktarma) resmî bir yazılı duyuruyla değil, liman
    yetkililerinin acentelere sözlü bildirimiyle uygulandı. Bu sitedeki kayıtlar gemi hareketini gösterir;
    yükün sahibini, satıcısını veya hukuki durumunu göstermez.

# --- Rapor künyesi --------------------------------------------------------------
# Raporun "Hazırlayan" satırı. Kurumlara sunarken kişi ya da kuruluş adı yazılabilir (sitede herkese açık görünür).
rapor:
  hazirlayan: "Avvam, açık kaynak gemi izleme projesi"
  hazirlayan_en: "Avvam, an open-source vessel monitoring project"

# --- Ülkeler --------------------------------------------------------------------
# varis_anahtarlari: gemilerin AIS'e yazdığı varış noktasında bu ülkeyi gösteren kelimeler
ulkeler:
  TR: {ad: "Türkiye", iso3: "TUR", varis_anahtarlari: ["TURKEY", "TURKIYE", "CEYHAN", "ISKENDERUN", "MERSIN", "ALIAGA", "ISTANBUL", "AMBARLI", "IZMIT"]}
  IL: {ad: "İsrail", iso3: "ISR", varis_anahtarlari: ["ISRAEL", "HAIFA", "HAYFA", "ASHDOD", "ASHKELON", "ASKELON", "EILAT", "HADERA"]}
  EG: {ad: "Mısır", iso3: "EGY", varis_anahtarlari: ["EGYPT", "PORT SAID", "PORTSAID", "SAID", "DAMIETTA", "ALEXANDRIA", "DEKHEILA", "SUEZ"]}
  CY: {ad: "Kıbrıs (GKRY)", iso3: "CYP", varis_anahtarlari: ["CYPRUS", "LIMASSOL", "LARNACA", "VASILIKO"]}
  GR: {ad: "Yunanistan", iso3: "GRC", varis_anahtarlari: ["GREECE", "PIRAEUS", "PIREAUS", "THESSALONIKI", "ELEFSIS"]}
  BG: {ad: "Bulgaristan", iso3: "BGR", varis_anahtarlari: ["BULGARIA", "BURGAS", "BOURGAS", "VARNA"]}

# --- Limanlar ---------------------------------------------------------------------
# Sıra önemli: bir nokta birden çok alana düşerse ilk sıradaki geçerlidir (kıyı alanı limanlardan sonra gelmeli).
limanlar:
  # ---------- Türkiye: izlenen limanlar (uğrayan her gemi takibe alınır) ----------
  - kod: ISK
    ad: "İskenderun Körfezi (Ceyhan, Dörtyol, İskenderun)"
    ulke: TR
    rol: izlenen
    gecmis_karanlik_tara: true
    alan: [[36.97, 35.62], [36.97, 36.30], [36.50, 36.30], [36.50, 35.82], [36.72, 35.62]]
    terminaller:
      - {ad: "Ceyhan petrol terminalleri (BTC, Kerkük-Ceyhan)", yuk: sivi_dokme, merkez: [36.875, 35.925], yaricap_km: 4}
      - {ad: "Dörtyol petrol terminali", yuk: sivi_dokme, merkez: [36.83, 36.16], yaricap_km: 3}
      - {ad: "İsdemir / Payas", yuk: kuru_dokme, merkez: [36.75, 36.19], yaricap_km: 3}
      - {ad: "İskenderun limanı", yuk: genel_kargo, merkez: [36.59, 36.18], yaricap_km: 2.5}
  - kod: ALG
    ad: "Aliağa – Nemrut Körfezi"
    ulke: TR
    rol: izlenen
    gecmis_karanlik_tara: true
    alan: [[38.88, 26.82], [38.88, 27.00], [38.72, 27.00], [38.72, 26.82]]
    terminaller:
      - {ad: "Rafineri ve petrokimya iskeleleri (Tüpraş, STAR, Petkim)", yuk: sivi_dokme, merkez: [38.80, 26.92], yaricap_km: 3}
  - kod: MER
    ad: "Mersin"
    ulke: TR
    rol: izlenen
    gecmis_karanlik_tara: true
    merkez: [36.78, 34.64]
    yaricap_km: 7
  - kod: IST
    ad: "İstanbul – Ambarlı"
    ulke: TR
    rol: izlenen
    merkez: [40.965, 28.69]
    yaricap_km: 5
  - kod: IZM
    ad: "İzmit Körfezi (Kocaeli)"
    ulke: TR
    rol: izlenen
    alan: [[40.80, 29.35], [40.80, 29.95], [40.68, 29.95], [40.68, 29.35]]
    terminaller:
      - {ad: "Tüpraş İzmit rafinerisi iskeleleri", yuk: sivi_dokme, merkez: [40.75, 29.83], yaricap_km: 2.5}

  # ---------- İsrail: varış limanları ----------
  - {kod: HFA, ad: "Hayfa", ulke: IL, rol: varis, merkez: [32.82, 34.99], yaricap_km: 8}
  - {kod: HAD, ad: "Hadera (Orot Rabin)", ulke: IL, rol: varis, merkez: [32.47, 34.87], yaricap_km: 4,
     terminaller: [{ad: "Kömür iskelesi", yuk: kuru_dokme, merkez: [32.47, 34.87], yaricap_km: 2}]}
  - {kod: ASD, ad: "Aşdod", ulke: IL, rol: varis, merkez: [31.82, 34.63], yaricap_km: 6}
  - {kod: ASK, ad: "Aşkelon (EAPC petrol terminali)", ulke: IL, rol: varis, merkez: [31.67, 34.51], yaricap_km: 7,
     terminaller: [{ad: "EAPC petrol şamandıraları", yuk: sivi_dokme, merkez: [31.68, 34.50], yaricap_km: 4}]}
  - {kod: ETH, ad: "Eilat", ulke: IL, rol: varis, merkez: [29.53, 34.95], yaricap_km: 6}

  # ---------- Ara ülkeler (aktarma / sahte varış noktası olarak kullanılanlar) ----------
  - {kod: PSD, ad: "Port Said", ulke: EG, rol: varis, merkez: [31.27, 32.31], yaricap_km: 12}
  - {kod: DAM, ad: "Dimyat (Damietta)", ulke: EG, rol: varis, merkez: [31.47, 31.76], yaricap_km: 6}
  - {kod: ALX, ad: "İskenderiye ve Dekheila", ulke: EG, rol: varis, merkez: [31.17, 29.85], yaricap_km: 9}
  - {kod: LMS, ad: "Limasol", ulke: CY, rol: varis, merkez: [34.65, 33.03], yaricap_km: 7}
  - {kod: LCA, ad: "Larnaka", ulke: CY, rol: varis, merkez: [34.91, 33.64], yaricap_km: 7}
  - {kod: VAS, ad: "Vasiliko", ulke: CY, rol: varis, merkez: [34.71, 33.32], yaricap_km: 5}
  - {kod: PIR, ad: "Pire", ulke: GR, rol: varis, merkez: [37.93, 23.60], yaricap_km: 8}
  - {kod: SKG, ad: "Selanik", ulke: GR, rol: varis, merkez: [40.62, 22.92], yaricap_km: 6}
  - {kod: BOJ, ad: "Burgaz", ulke: BG, rol: varis, merkez: [42.48, 27.48], yaricap_km: 6}
  - {kod: VAR, ad: "Varna", ulke: BG, rol: varis, merkez: [43.19, 27.92], yaricap_km: 6}

  # ---------- İsrail kıyı yaklaşma alanı (limanlardan SONRA gelmeli) ----------
  # Kıyıya ~25 km'ye kadar. Buraya girip hiçbir limana uğramadan sinyali kesilen gemiler işaretlenir.
  - kod: ILK
    ad: "İsrail kıyı yaklaşma alanı"
    ulke: IL
    rol: varis
    yaklasma: true
    alan: [[33.09, 35.15], [33.09, 34.80], [32.80, 34.70], [32.40, 34.60], [32.00, 34.48], [31.70, 34.28],
           [31.59, 34.22], [31.59, 34.60], [32.00, 34.85], [32.50, 34.95], [33.00, 35.15]]

# --- Ek dinleme alanları (liman değil) --------------------------------------------
# Bu alanlardaki bütün gemiler dinlenir; böylece takipteki bir gemi burada başka bir gemiyle
# buluşursa diğer gemi de görülür ve takibe alınır.
izleme_alanlari:
  - {ad: "Lakonya Körfezi (gemiden gemiye aktarma bölgesi)", alan: [[36.80, 22.50], [36.80, 23.10], [36.40, 23.10], [36.40, 22.50]]}

# --- Hangi gemiler takibe alınsın ------------------------------------------------
gemi_filtresi:
  tipler: ["kargo", "tanker", "bilinmiyor"]
  min_boy_m: 80

aisstream:
  # Bu kelimelerden biri varış noktasında geçen gemiler canlı takipte öncelik alır
  oncelikli_varis: ["FOR ORDERS", "ORDERS", "IL", "EG", "CY", "ISRAEL", "HAIFA", "ASHDOD", "ASHKELON", "EILAT",
                    "PORT SAID", "PORTSAID", "SAID", "DAMIETTA", "ALEXANDRIA", "CYPRUS", "LIMASSOL", "LARNACA"]

# --- Eşikler (değiştirmek zorunda değilsin) -----------------------------------------
esikler:
  ziyaret_min_dakika: 60
  takip_gun: 45                # takip süresi (karanlık seferler haftalar sürebiliyor)
  guzergah_max_gun: 90
  ais_bosluk_saat: 6
  karanlik_sefer_saat: 24      # bu kadar saatten uzun AIS boşluğu "karanlık sefer" adayı
  karanlik_sefer_gun: 30
  karanlik_bolge: [[30.0, 25.0], [37.6, 36.6]]   # Doğu Akdeniz: Rodos'un doğusu ve güneyi
  # İsrail açıkları: kıyıdan ~40-110 km. Batı sınırı 34° D: Ceyhan'dan Port Said'e giden rota bunun batısında kalır.
  # Kuzey sınırı 33,1° K (Lübnan sınırı), güney sınırı 31,2° K. Basında adı geçen Ceyhan tankerleri AIS'i
  # Doğu Akdeniz'de kapatıp Aşkelon'dan ayrılınca açıyor; kapanma ya da açılma noktası bu kutuya düşer.
  hedef_acik_deniz: [[31.2, 34.0], [33.1, 35.2]]
  hedef_acik_bosluk_saat: 12
  # İsrail'in GPS karıştırması: İsrail yakınındaki gemi ve uçakların sahte konumu çoğunlukla Beyrut havalimanında görünür
  # (NPR, 22 Nisan 2024; Lloyd's List). Kara üzerindeki bu noktada AIS konumu görünen gemi karıştırma menzilindedir.
  sahte_konum_noktalari:
    - {ad: "Beyrut havalimanı", merkez: [33.8209, 35.4884], yaricap_km: 4}
  limansiz_donus_gun: 20
  yaklasma_sessizlik_saat: 6
  sts_mesafe_m: 500
  sts_sure_saat: 2
  draft_degisim_m: 1.0

# --- Geçmiş tarama (Global Fishing Watch) -----------------------------------------
gecmis:
  onceki_gun: 120              # her geminin geçmişine bu kadar gün daha geriden bakılır
  erken_baslangic: "2023-10-07"  # beyandan önceki dönem de taranır; bu seferler haritada ve raporlarda "beyandan önce" diye ayrılır
  max_gemi_liman: 8000         # karanlık sefer taramasında liman başına en fazla gemi (tarama saatlik dilimlerle ilerler)

yayin:
  # Sitenin herkese açık adresi: paylaşım metinlerindeki bağlantılar bununla kurulur
  adres: "https://hakanul-barreyn.github.io/liman-izleme/"
  # GitHub deposu: raporun tarihli PDF sürümleri bu deponun Releases bölümünde (rapor-AAAA-AA-GG, rapor-son)
  depo: "hakanul-barreyn/liman-izleme"
  ham_veri_yayinla: true
  opentimestamps: true
  site_guncelleme_dakika: 60
  gunluk_saat: "00:05"

# Azerbaycan petrolü: resmî açıklamalar ve resmî kayıtlar (rapor Bölüm 4.7). Her satır kaynağıyla.
# tur: resmi = devlet/şirket açıklaması ya da resmî istatistik; izleme = ticari tanker izleme verisi (karşılaştırma için).
azerbaycan:
  btc:            # BTC operatörü BP'nin yıllık sonuçları: Ceyhan'da yüklenen varil ve tanker sayısı
    yil: 2024
    varil: 223000000
    tanker: 305
    kaynak: "bp Azerbaijan, 2024 full year results"
    url: "https://www.bp.com/en_az/azerbaijan/home/news/business-updates/2024-full-year-results.html"
  tahmin:         # İsrail'e giden Azerbaycan ham petrolü (izleme verisi) ve Azerbaycan gümrüğünün İsrail kaydı
    - yil: 2023
      gumruk_ton: 2240000      # Ocak-Kasım 2023, Devlet Gümrük Komitesi (Globes, 5 Mayıs 2024)
    - yil: 2024
      varil_gun: 71800         # 2025 değeri ve %31 yıllık artıştan türetildi (Kpler, Reuters 21 Ocak 2026)
      gumruk_ton: 1173003      # Devlet Gümrük Komitesi (Report.az)
      kaynak: "Kpler (Reuters), 2025 değerinden türetildi"
    - yil: 2025
      varil_gun: 94000
      gumruk_ton: 0            # Ocak-Kasım 2025 ithalatçı ülke listesinde İsrail yok
      kaynak: "Kpler (Reuters, 21 Ocak 2026)"
  aciklamalar:
    - kurum: "Azerbaycan Devlet Gümrük Komitesi"
      kurum_en: "State Customs Committee of Azerbaijan"
      gun: "2024-05-05"
      tarih_not: "Globes haberinin tarihi"
      tur: resmi
      metin: "Ocak-Kasım 2023'te İsrail, Azerbaycan ham petrolünün ikinci büyük alıcısı: 2,24 milyon ton, 1,38 milyar dolar. Ocak 2024'te en büyük alıcı: 523,5 bin ton, 297 milyon dolar."
      metin_en: "January-November 2023: Israel the second-largest buyer of Azerbaijani crude, 2.24 million tonnes, USD 1.38 billion. January 2024: the largest buyer, 523,500 tonnes, USD 297 million."
      kaynak: "Globes (5 Mayıs 2024), Azerbaijani oil continues flowing to Israel via Turkey"
      url: "https://en.globes.co.il/en/article-azerbaijani-oil-continues-flowing-to-israel-via-turkey-1001477929"
    - kurum: "SOCAR"
      kurum_en: "SOCAR"
      gun: "2024-06-03"
      tur: resmi
      metin: "SOCAR, İsrail'e doğrudan ham petrol sattığı yönündeki suçlamaların doğru olmadığını açıkladı."
      metin_en: "SOCAR stated that accusations that it sells crude oil to Israel directly are not true."
      kaynak: "Turan (3 Haziran 2024), SOCAR denies direct oil sales to Israel"
      url: "https://turan.az/en/politics/socar-denies-direct-oil-sales-to-israel"
    - kurum: "T.C. Enerji ve Tabii Kaynaklar Bakanlığı"
      kurum_en: "Ministry of Energy and Natural Resources of Türkiye"
      gun: "2024-11-11"
      tur: resmi
      metin: "BTC boru hattını kullanan şirketler Türkiye'nin İsrail'le ticaret yapmama kararına uydu; BOTAŞ Azerbaycan petrolünün satışında taraf değil; Ceyhan'dan İsrail varışlı yükleme yapılmadı."
      metin_en: "Companies using the BTC pipeline respected Türkiye's decision not to trade with Israel; BOTAŞ is not party to the sale of Azerbaijani oil; no cargo was loaded at Ceyhan with Israel as destination."
      kaynak: "Daily Sabah (11 Kasım 2024), Türkiye rejects claims of oil flowing to Israel from Ceyhan"
      url: "https://dailysabah.com/business/energy/turkiye-rejects-claims-of-oil-flowing-to-israel-from-ceyhan"
    - kurum: "bp Azerbaycan (BTC operatörü)"
      kurum_en: "bp Azerbaijan (BTC operator)"
      gun: "2025-02"
      tur: resmi
      metin: "2024'te BTC ile taşınan yaklaşık 223 milyon varil (29 milyon ton) ham petrol Ceyhan'da 305 tankere yüklendi."
      metin_en: "In 2024 about 223 million barrels (29 million tonnes) of BTC crude were lifted at Ceyhan on 305 tankers."
      kaynak: "bp Azerbaijan, 2024 full year results"
      url: "https://www.bp.com/en_az/azerbaijan/home/news/business-updates/2024-full-year-results.html"
    - kurum: "İsrail Enerji ve Altyapı Bakanı Eli Cohen"
      kurum_en: "Israeli Minister of Energy and Infrastructure Eli Cohen"
      gun: "2025-03-17"
      tur: resmi
      metin: "SOCAR ve BP'ye İsrail açıklarında doğalgaz arama ruhsatı verilmesi üzerine: “SOCAR ve BP'nin girişi İsrail Devleti için mükemmel bir haber.”"
      metin_en: "On the award of offshore gas exploration licences to SOCAR and BP: “The entry of SOCAR and BP is excellent news for the State of Israel.”"
      kaynak: "The Algemeiner (17 Mart 2025)"
      url: "https://www.algemeiner.com/2025/03/17/israel-azerbaijan-strengthen-strategic-alliance-gas-exploration-deal-signing-jerusalem/"
    - kurum: "Azerbaycan Devlet Gümrük Komitesi"
      kurum_en: "State Customs Committee of Azerbaijan"
